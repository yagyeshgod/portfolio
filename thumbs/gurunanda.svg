<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gurunanda ecommerce thumbnail">
  <defs>
    <linearGradient id="bgGN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <clipPath id="shotGN">
      <rect x="660" y="80" width="440" height="300" rx="16" ry="16"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGN)"/>
  <!-- white frame card -->
  <rect x="60" y="60" width="1080" height="510" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="100" y="150" fill="#111827" font-family="Poppins, Arial, sans-serif" font-size="48" font-weight="800">Gurunanda.com</text>
  <text x="100" y="190" fill="#6b21a8" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600">Essential Oils Ecommerce</text>
  <!-- copy block lines -->
  <rect x="100" y="230" width="420" height="12" rx="6" fill="#e9d5ff"/>
  <rect x="100" y="255" width="380" height="10" rx="5" fill="#ddd6fe"/>
  <rect x="100" y="280" width="400" height="10" rx="5" fill="#ddd6fe"/>
  <!-- embedded screenshot on the right -->
  <image href="./gurunanda.png" x="660" y="80" width="440" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#shotGN)"/>
  <rect x="660" y="80" width="440" height="300" rx="16" ry="16" fill="none" stroke="#e5e7eb"/>
  <!-- small device mock bars -->
  <rect x="660" y="400" width="120" height="12" rx="6" fill="#c7d2fe"/>
  <rect x="800" y="400" width="80" height="12" rx="6" fill="#e9d5ff"/>
</svg>