<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Locale Magazine thumbnail">
  <defs>
    <linearGradient id="bgLM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgLM)"/>
  <rect x="60" y="60" width="1080" height="510" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="100" y="150" fill="#111827" font-family="Poppins, Arial, sans-serif" font-size="54" font-weight="800">Locale Magazine</text>
  <text x="100" y="195" fill="#6b21a8" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="600">Lifestyle Publication Website</text>
  <!-- Grid motif -->
    <defs>
      <clipPath id="shotLM">
        <rect x="780" y="100" width="320" height="220" rx="16" ry="16"/>
      </clipPath>
    </defs>
    <g transform="translate(100,230)">
      <rect x="0" y="0" width="300" height="220" rx="12" fill="#f3e8ff" stroke="#e9d5ff"/>
      <rect x="320" y="0" width="300" height="90" rx="12" fill="#e0e7ff" stroke="#dbeafe"/>
      <rect x="320" y="110" width="300" height="110" rx="12" fill="#d1fae5" stroke="#bbf7d0"/>
    </g>
    <!-- embedded screenshot on the right -->
    <image href="./locale.png" x="780" y="100" width="320" height="220" preserveAspectRatio="xMidYMid slice" clip-path="url(#shotLM)"/>
    <rect x="780" y="100" width="320" height="220" rx="16" ry="16" fill="none" stroke="#e5e7eb"/>
  <rect x="980" y="96" rx="14" ry="14" width="160" height="44" fill="#7c3aed"/>
  <text x="1005" y="125" fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700">Magazine</text>
</svg>